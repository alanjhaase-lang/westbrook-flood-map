<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" href="data:,">
<title>River gauges: Westbrook, Ipswich, Brisbane &amp; Sunshine Coast</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel { background: rgba(255,255,255,.93); padding: 8px 10px; border-radius: 6px;
           box-shadow: 0 1px 5px rgba(0,0,0,.35); font-size: 13px; line-height: 1.35; }
  .title b { font-size: 15px; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 50%;
              margin-right: 6px; vertical-align: -2px; border: 1px solid #333; }
  .gauge { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #222;
           display: flex; align-items: center; justify-content: center;
           font: bold 15px/1 system-ui, sans-serif; color: #111; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .gauge.stale { opacity: .55; border-style: dashed; }
  /* Within 0.2 m of the next flood class: pulse toward that class colour */
  .gauge.flash-minor { animation: flashMinor 1.1s ease-in-out infinite; }
  .gauge.flash-moderate { animation: flashModerate 1.1s ease-in-out infinite; }
  .gauge.flash-major { animation: flashMajor 1.1s ease-in-out infinite; }
  @keyframes flashMinor {
    0%, 100% { background: #2ecc40; }
    50% { background: #ffdc00; }
  }
  @keyframes flashModerate {
    0%, 100% { background: #ffdc00; }
    50% { background: #ff851b; }
  }
  @keyframes flashMajor {
    0%, 100% { background: #ff851b; }
    50% { background: #e3261c; }
  }
  .wb-label { display: inline-block; transform: translate(-50%, -50%); white-space: nowrap; font: 600 12px/1.2 system-ui, sans-serif;
              color: #222; background: rgba(255,255,255,.85); border: 1px solid #888; border-radius: 3px; padding: 1px 5px; }
  .disc { font-size: 11.5px; color: #555; margin-top: 3px; }
  .disc a { color: #555; }
  #notice { position: absolute; z-index: 1100; left: 50%; bottom: 28px; transform: translateX(-50%);
            width: min(460px, calc(100% - 24px)); box-sizing: border-box; background: #fff; border-left: 4px solid #a15c00;
            border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.4); padding: 10px 12px; font: 13px/1.4 system-ui, sans-serif; }
  #notice p { margin: 0 0 8px; }
  #notice button { font: inherit; padding: 4px 12px; border: 1px solid #888; border-radius: 4px; background: #f3f3f3; cursor: pointer; }
  .popup table { border-collapse: collapse; font-size: 12.5px; }
  .popup td { padding: 1px 6px 1px 0; vertical-align: top; }
  .popup td:first-child { color: #555; white-space: nowrap; }
  .warn { color: #a15c00; }
  .fl-lv { display: inline-block; padding: 0 4px; margin: 1px 0; border: 1px solid #ccc; border-radius: 3px;
           font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fl-lv.on { border-color: #222; font-weight: bold; color: #111; }
  #err { color: #b00; }
  #live { font-size: 11.5px; color: #555; margin-top: 2px; }
  #live.ok { color: #2e7d32; }
  #live.off { color: #a15c00; }
  .title { max-width: 300px; }
  .title .hdr { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .title .hdr b { flex: 1; }
  .title .chev { font-size: 12px; opacity: .7; }
  .regions { margin-top: 6px; border-top: 1px solid #ddd; padding-top: 5px; }
  .regions label { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; }
  .regions input { width: 17px; height: 17px; margin: 0; flex: none; }
  .regions .sw { width: 12px; height: 12px; border: 2px dashed; border-radius: 50%; flex: none; }
  .regions .nm { flex: 1; }
  .regions .ct { color: #555; font-variant-numeric: tabular-nums; }
  .regions .fl { color: #c62828; font-weight: bold; }
  .regions button { font: inherit; font-size: 11.5px; padding: 2px 7px; border: 1px solid #aaa;
                    border-radius: 4px; background: #f6f6f6; cursor: pointer; flex: none; }
  .regions .row2 { display: flex; align-items: center; gap: 6px; margin-top: 4px; padding-top: 4px; border-top: 1px solid #eee; }
  .regions .row2 label { flex: 1; }
  .radar { margin-top: 6px; border-top: 1px solid #ddd; padding-top: 5px; }
  .radar label { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; }
  .radar input[type=checkbox] { width: 17px; height: 17px; margin: 0; flex: none; }
  .radar .rc { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
  .radar button { font: inherit; font-size: 12px; padding: 2px 8px; border: 1px solid #aaa; border-radius: 4px;
                  background: #f6f6f6; cursor: pointer; min-width: 34px; }
  .radar .ts { flex: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .radar input[type=range] { flex: 1; min-width: 90px; margin: 0; }
  .radar .scale { height: 8px; border-radius: 4px; margin: 4px 0 1px; border: 1px solid #bbb;
    background: linear-gradient(to right, #88ddee, #00a3e0, #005588, #ffee00, #ffaa00, #ff4400, #c10000, #ffaaff); }
  .radar .sl { display: flex; justify-content: space-between; font-size: 11px; color: #555; }
  .radar .note { font-size: 11px; color: #555; }
  .leaflet-radar-pane img { pointer-events: none; }
  .roads { margin-top: 6px; border-top: 1px solid #ddd; padding-top: 5px; }
  .roads label { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; }
  .roads input { width: 17px; height: 17px; margin: 0; flex: none; }
  .roads .ct { color: #555; font-variant-numeric: tabular-nums; }
  .roads .note { font-size: 11px; color: #555; }
  .roads.gg { margin-top: 0; border-top: 0; padding-top: 0; }
  .roads.gg + .roads { margin-top: 2px; border-top: 0; padding-top: 0; }
  .roads .sub { padding-left: 23px; }
  .roads .sub.off { opacity: .45; }
  .roads .sub.off label { cursor: default; }
  .roads .fl { color: #c62828; font-weight: bold; }
  .gico { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #222; background: #4caf50; box-sizing: border-box; flex: none; }
  .sec { margin-top: 7px; padding-top: 4px; border-top: 1px solid #ddd; font-size: 10.5px; font-weight: 600;
         letter-spacing: .06em; text-transform: uppercase; color: #777; }
  .sec + .regions, .sec + .roads { margin-top: 0; border-top: 0; padding-top: 0; }
  .roads .stale { color: #a15c00; font-size: 11.5px; }
  .ne { width: 18px; height: 18px; border-radius: 50%; background: #d50000; border: 2px solid #fff; box-sizing: border-box;
        box-shadow: 0 0 0 1px #7f0000, 0 1px 3px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
  .ne::after { content: ""; width: 9px; height: 3px; background: #fff; border-radius: 1px; }
  .ne.part { background: #ffab00; box-shadow: 0 0 0 1px #8a5a00, 0 1px 3px rgba(0,0,0,.5); border-radius: 3px; transform: rotate(45deg); width: 15px; height: 15px; }
  .ne.part::after { width: 3px; height: 8px; background: #222; transform: rotate(-45deg); }
  .cam { width: 22px; height: 22px; border-radius: 50%; background: #263238; border: 2px solid #fff; box-sizing: border-box;
         box-shadow: 0 1px 3px rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; }
  .cam.old { background: #78909c; }
  .cam svg { width: 13px; height: 13px; fill: #fff; }
  .legend .sym { display: inline-flex; width: 20px; justify-content: center; margin-right: 4px; vertical-align: -4px; }
  .legend .ln { display: inline-block; width: 18px; height: 0; border-top: 3px solid #d50000; margin: 0 5px 0 1px; vertical-align: 3px; }
  .legend .ln.part { border-top: 3px dashed #ffab00; }
  .campop { width: min(280px, calc(100vw - 80px)); }
  .campop img { display: block; width: 100%; height: auto; min-height: 60px; background: #eee; border-radius: 3px; margin: 4px 0; }
  .ctr { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 2px #000; }
  #body { max-height: calc(100vh - 150px); overflow-y: auto; }
  @media (max-width: 600px) { .panel { font-size: 12px; } .title b { font-size: 13px; }
                              .title { max-width: 230px; } .regions label, .roads label { padding: 5px 0; } .sec { margin-top: 5px; } }
</style>
</head>
<body>
<div id="map"></div>
<script>
const COLORS = {
  "below flood level": "#2ecc40",
  "minor": "#ffdc00",
  "moderate": "#ff851b",
  "major": "#e3261c",
  "none": "#9e9e9e"
};
const LABELS = [["below flood level","Below Flood Level"],["minor","Minor"],
                ["moderate","Moderate"],["major","Major"],["none","None / unknown"]];
const Z = { "major": 800, "moderate": 700, "minor": 600, "below flood level": 300, "none": 0 };
const CAM_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>';
const ARROWS = { rising: "\u2191", falling: "\u2193", steady: "\u2013" };

function classKey(fc) {
  const k = (fc || "").trim().toLowerCase();
  if (k.startsWith("below")) return "below flood level";
  if (k.startsWith("minor")) return "minor";
  if (k.startsWith("moderate")) return "moderate";
  if (k.startsWith("major")) return "major";
  return "none";
}
// Prefer class computed from height vs flood levels (incl. community estimates);
// fall back to the BOM bulletin class when we have no levels for the gauge.
function effectiveClass(s) {
  if (s.computed_class) return s.computed_class;
  return s.flood_class;
}
// Pulse toward the next class when within 0.2 m of it.
function nearNextFlash(s) {
  const d = s.delta_m;
  if (d == null || !(d > 0) || d > 0.2) return "";
  const nxt = (s.next_class || "").toLowerCase();
  if (nxt === "minor") return " flash-minor";
  if (nxt === "moderate") return " flash-moderate";
  if (nxt === "major") return " flash-major";
  return "";
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const map = L.map("map", { zoomControl: true }).setView([-27.60, 151.87], 9);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Data: <a href="https://www.bom.gov.au/qld/flood/rain_river.shtml">Bureau of Meteorology</a>'
}).addTo(map);
map.attributionControl.addAttribution('Road data &copy; State of Queensland (<a href="https://qldtraffic.qld.gov.au/" target="_blank" rel="noopener">QLDTraffic</a>), ' +
  '<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>');

const LS_REGIONS = "floodmap.regions.v1", LS_FLOOD = "floodmap.floodOnly.v1", LS_OPEN = "floodmap.panelOpen.v1",
      LS_RADAR = "floodmap.radar.v1", LS_CLOSURES = "floodmap.closures.v1", LS_CAMERAS = "floodmap.cameras.v1",
      LS_GAUGES = "floodmap.gauges.v1";
let gaugesOn = lsGet(LS_GAUGES, true) !== false;
function lsGet(k, dflt) { try { const v = localStorage.getItem(k); return v == null ? dflt : JSON.parse(v); } catch (e) { return dflt; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

const enabled = lsGet(LS_REGIONS, {});          // region id -> bool (missing = on)
let floodOnly = !!lsGet(LS_FLOOD, false);
const groups = {};                              // region id -> {layer, markers, boundary, meta}
let lastData = null, fitted = false, uiBuilt = false;

function isOn(id) { return enabled[id] !== false; }
function inFlood(s) { return ["minor", "moderate", "major"].includes(classKey(effectiveClass(s))); }

const LS_NOTICE = "floodmap.disclaimer.v1";
const DISCLAIMER = 'Unofficial community map. Data from the Bureau of Meteorology may be delayed or contain ' +
  'faulty readings. Do not rely on it for safety decisions. Check ' +
  '<a href="https://www.bom.gov.au/qld/warnings/" target="_blank" rel="noopener">BOM warnings (bom.gov.au)</a>, ' +
  'your council disaster dashboard, and call SES <a href="tel:132500">132 500</a> or ' +
  '<a href="tel:000">000</a> in an emergency.';
function showNotice() {
  if (document.getElementById("notice")) return;
  const n = document.createElement("div");
  n.id = "notice"; n.setAttribute("role", "dialog"); n.setAttribute("aria-label", "Disclaimer");
  n.innerHTML = `<p><b>Please note:</b> ${DISCLAIMER}</p><button type="button">OK, got it</button>`;
  L.DomEvent.disableClickPropagation(n); L.DomEvent.disableScrollPropagation(n);
  n.querySelector("button").onclick = () => { lsSet(LS_NOTICE, true); n.remove(); };
  document.getElementById("map").appendChild(n);
}
if (!lsGet(LS_NOTICE, false)) showNotice();

const info = L.control({ position: "topright" });
info.onAdd = () => {
  const d = L.DomUtil.create("div", "panel title");
  d.innerHTML = '<div class="hdr" id="hdr"><b>River gauges: Westbrook, Ipswich, Brisbane &amp; Sunshine Coast</b>' +
    '<span class="chev" id="chev"></span></div>' +
    '<div class="disc">Unofficial community map \u2014 not for safety decisions. ' +
    '<a href="https://www.bom.gov.au/qld/warnings/" target="_blank" rel="noopener">BOM warnings</a> &middot; ' +
    '<a href="#" id="discmore">more</a></div>' +
    '<div id="body"><div id="upd">Loading\u2026</div><div id="live"></div><div id="err"></div><div class="sec">Areas</div><div class="regions" id="regions"></div>' +
    '<div class="sec">Layers</div><div class="roads gg" id="gauges"></div><div class="roads" id="roads"></div><div class="radar" id="radar"></div></div>';
  L.DomEvent.disableClickPropagation(d);
  L.DomEvent.disableScrollPropagation(d);
  d.querySelector("#discmore").onclick = (e) => { e.preventDefault(); showNotice(); };
  const body = d.querySelector("#body"), chev = d.querySelector("#chev");
  let open = lsGet(LS_OPEN, window.innerWidth >= 600);
  const apply = () => { body.style.display = open ? "" : "none"; chev.textContent = open ? "\u25B4 hide" : "\u25BE layers"; };
  d.querySelector("#hdr").onclick = () => { open = !open; lsSet(LS_OPEN, open); apply(); };
  apply();
  return d;
};
info.addTo(map);

const legend = L.control({ position: "bottomright" });
legend.onAdd = () => {
  const d = L.DomUtil.create("div", "panel legend");
  d.innerHTML = "<b id='lgt' style='cursor:pointer'>Legend ▾</b><div id='lgb'><b>Flood class</b><br>" +
    LABELS.map(([k, t]) => `<i style="background:${COLORS[k]}"></i>${t}`).join("<br>") +
    "<br><b>Tendency</b><br>\u2191 rising &nbsp; \u2193 falling &nbsp; \u2013 steady &nbsp; ? unknown" +
    "<br><span style='opacity:.7'>Dashed = no current reading</span>" +
    "<br><b>Westbrook</b> label = Westbrook &middot; dashed circles = regions" +
    "<br><b>Roads (QLDTraffic, flooding)</b>" +
    "<br><span class='sym'><span class='ne'></span></span>Road closed <span class='ln'></span>" +
    "<br><span class='sym'><span class='ne part'></span></span>Lanes affected / restricted <span class='ln part'></span>" +
    "<br><span class='sym'><span class='cam'>" + CAM_SVG + "</span></span>Flood camera</div>";
  L.DomEvent.disableClickPropagation(d);
  const body = d.querySelector("#lgb");
  if (window.innerWidth < 600) body.style.display = "none";
  d.querySelector("#lgt").onclick = () => { body.style.display = body.style.display === "none" ? "" : "none"; };
  return d;
};
legend.addTo(map);

function ensureGroups(regions) {
  for (const r of regions) {
    if (groups[r.id]) { groups[r.id].meta = r; continue; }
    const boundary = L.circle([r.lat, r.lon], { radius: r.radius_km * 1000, color: r.color, weight: 2,
      fill: true, fillOpacity: 0.04, dashArray: "6 6", interactive: false });
    const centre = r.id === "westbrook"
      ? L.marker([r.lat, r.lon], { icon: L.divIcon({ className: "", html: '<span class="wb-label">Westbrook</span>',
                                    iconSize: [0, 0], iconAnchor: [0, 0] }), zIndexOffset: 1000 })
      : L.marker([r.lat, r.lon], { icon: L.divIcon({ className: "", html: `<div class="ctr" style="background:${r.color}"></div>`,
                                    iconSize: [14, 14], iconAnchor: [7, 7] }), zIndexOffset: -1000 });
    centre.bindPopup(`<b>${esc(r.name)}</b><br>Centre: ${esc(r.centre_name)}<br>${r.lat}, ${r.lon}<br>Radius: ${r.radius_km} km`);
    const markers = L.layerGroup();
    const layer = L.layerGroup([boundary, centre, markers]);
    groups[r.id] = { layer, markers, boundary, meta: r };
    if (isOn(r.id)) layer.addTo(map);
  }
}

function enabledBounds() {
  let b = null;
  for (const id in groups) if (isOn(id)) {
    const gb = groups[id].boundary.getBounds();
    b = b ? b.extend(gb) : L.latLngBounds(gb.getSouthWest(), gb.getNorthEast());
  }
  return b;
}
function fitEnabled() {
  const b = enabledBounds() || (groups.westbrook && groups.westbrook.boundary.getBounds());
  if (b) map.fitBounds(b, { padding: [10, 10] });
}

function buildUi(regions) {
  const el = document.getElementById("regions");
  el.innerHTML = regions.map(r => `<label><input type="checkbox" data-r="${esc(r.id)}" ${isOn(r.id) ? "checked" : ""}>
      <span class="sw" style="border-color:${r.color}"></span>
      <span class="nm">${esc(r.name)}${r.id === "westbrook" ? ` (${r.radius_km} km)` : ""}
        <span class="ct" id="ct-${esc(r.id)}"></span></span>
      <button type="button" data-z="${esc(r.id)}" title="Zoom to ${esc(r.name)}">Zoom</button></label>`).join("") +
    `<div class="row2"><label><span>Fit map to ticked areas</span></label>
      <button type="button" id="fitall">Fit on</button></div>`;
  buildGaugesUi();
  el.querySelectorAll("input[data-r]").forEach(cb => cb.onchange = () => {
    const id = cb.dataset.r; enabled[id] = cb.checked; lsSet(LS_REGIONS, enabled);
    if (cb.checked) groups[id].layer.addTo(map); else map.removeLayer(groups[id].layer);
    syncRoadLayers(); updateRoadCounts(); updateGaugeCount();
  });
  el.querySelectorAll("button[data-z]").forEach(btn => btn.onclick = (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    const id = btn.dataset.z;
    if (!isOn(id)) { enabled[id] = true; lsSet(LS_REGIONS, enabled); groups[id].layer.addTo(map);
                     el.querySelector(`input[data-r="${id}"]`).checked = true; syncRoadLayers(); updateRoadCounts(); updateGaugeCount(); }
    map.fitBounds(groups[id].boundary.getBounds(), { padding: [10, 10] });
  });
  el.querySelector("#fitall").onclick = fitEnabled;
  uiBuilt = true;
}

const CLS = [["minor", "Minor"], ["moderate", "Moderate"], ["major", "Major"]];
function m2(v) { return `${Number(v).toFixed(2)} m`; }
function floodNext(s) {            // short text: next class + metres to go
  if (!s.flood_levels || s.height_m == null) return "";
  if (s.next_class) return `Next: ${s.next_class} at ${m2(s.next_level_m)}, ${m2(s.delta_m)} to go`;
  if (s.above_major_m != null) return `Above Major by ${m2(s.above_major_m)}`;
  return "";
}
function floodRows(s) {
  const lv = s.flood_levels;
  if (!lv) {
    const why = (s.flood_levels_note || "").startsWith("datum mismatch")
      ? `<span class="warn">Flood levels not compared (${esc(s.flood_levels_note)})</span>`
      : '<span style="color:#777">No official flood levels for this gauge</span>';
    return [["Flood levels", why]];
  }
  const cur = classKey(s.computed_class);
  const list = CLS.filter(([k]) => lv[k] != null).map(([k, t]) => {
    const on = cur === k;
    return `<span class="fl-lv${on ? " on" : ""}" style="${on ? `background:${COLORS[k]}` : ""}">${t} ${Number(lv[k]).toFixed(2)}</span>`;
  }).join(" ");
  const rows = [];
  if (s.height_m == null) rows.push(["Next", "\u2014 (no current reading)"]);
  else if (s.next_class) rows.push(["Next", `<b>${esc(s.next_class)} at ${m2(s.next_level_m)}, ${m2(s.delta_m)} to go</b>`]);
  else if (s.above_major_m != null) rows.push(["Next", `<b>None \u2014 above Major by ${m2(s.above_major_m)}</b>`]);
  rows.push(["Flood levels", `${list} <span style="color:#777">m ${esc(lv.datum)}</span>`]);
  if (lv.source === "user")
    rows.push(["", `<span style="color:#777">Community estimate (not official BOM)</span>`]);
  if (s.class_check && s.class_check.startsWith("differs"))
    rows.push(["", `<span class="warn">Computed ${esc(s.computed_class)}; ${esc(s.class_check)}</span>`]);
  return rows;
}

function popupHtml(s) {
  const geo = s.geocoded ? '<span class="warn">approximate (geocoded from name)</span>' : esc(s.coord_source);
  const rows = [
    ["Station", esc(s.name)],
    ["Height", s.height_m == null ? "\u2014" : `${s.height_m.toFixed(2)} m ${esc(s.datum)}`],
    ["Time", (esc(s.time) || "\u2014") + obsAge(s) + (s.live ? ' <span style="color:#2e7d32">(live from BOM)</span>' : ' <span style="color:#777">(GitHub snapshot)</span>')],
    ["Tendency", esc(s.tendency) || "\u2014"],

// ---- Rain radar (RainViewer public Weather Maps API: past 2 h, 10-min frames, max zoom 7, Universal Blue) ----
const RV_API = "https://api.rainviewer.com/public/weather-maps.json";
const RV_ATTR = 'Radar &copy; <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a>';
const RV_COLOR = 2, RV_OPTS = "1_0";            // 2 = Universal Blue (only free scheme); smoothed, no snow colours
map.createPane("radar");

map.getPane("radar").style.pointerEvents = "none";

const radar = { on: radarSaved.on === true, opacity: typeof radarSaved.opacity === "number" ? radarSaved.opacity : 0.6,

function saveRadar() { lsSet(LS_RADAR, { on: radar.on, opacity: radar.opacity }); }
const fmtBne = new Intl.DateTimeFormat("en-AU", { timeZone: "Australia/Brisbane", hour: "2-digit", minute: "2-digit",
                                                   hour12: false, weekday: "short" });
function radarLayer(f) {
  if (!radar.layers[f.path]) {

    // so maxNativeZoom 8 (= tile zoom 7); beyond that Leaflet upscales the z7 tiles instead of dropping them.
    radar.layers[f.path] = L.tileLayer(`${radar.host}${f.path}/512/{z}/{x}/{y}/${RV_COLOR}/${RV_OPTS}.png`, {
      pane: "radar", tileSize: 512, zoomOffset: -1, minNativeZoom: 1, maxNativeZoom: 8, maxZoom: 18,
      opacity: 0, attribution: RV_ATTR, keepBuffer: 1, updateWhenIdle: true });

  const cur = radar.frames[radar.idx];
  for (const f of radar.frames) {
    const lyr = radar.layers[f.path];
    if (f === cur) { const l = radarLayer(f); if (!map.hasLayer(l)) l.addTo(map); l.setOpacity(radar.opacity); }
    else if (lyr) { if (radar.playing) lyr.setOpacity(0); else map.removeLayer(lyr); }
  }
  updateRadarUi();
}
function preloadFrames() { for (const f of radar.frames) { const l = radarLayer(f); if (!map.hasLayer(l)) l.addTo(map); } }

function tick() {   // loops oldest -> latest, holding a little longer on the latest frame
  showFrame(radar.idx + 1);

}

    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const past = (d.radar && d.radar.past) || [];
    if (!past.length) throw new Error("no radar frames listed");
    const atLatest = radar.idx < 0 || radar.idx === radar.frames.length - 1;
    radar.host = d.host;
    const keep = new Set(past.map(f => f.path));
    for (const k in radar.layers) if (!keep.has(k)) { map.removeLayer(radar.layers[k]); delete radar.layers[k]; }
    const curPath = radar.frames[radar.idx] && radar.frames[radar.idx].path;
    radar.frames = past;
    radar.err = "";
    if (!radar.on) return;
    if (radar.playing) preloadFrames();
    let i = past.length - 1;
    if (!atLatest && curPath) { const j = past.findIndex(f => f.path === curPath); if (j >= 0) i = j; }
    showFrame(i);

  }
}

function buildRadarUi() {

    <div id="rvctl">

      <div class="rc"><span>Opacity</span><input type="range" id="rvop" min="0.1" max="1" step="0.05" value="${radar.opacity}"></div>

// GitHub Actions (update_data.py, every 15 min) commits data.json; between runs the page also tries to read the
// BOM river height bulletins directly and overlays any newer readings on the committed stations. If the browser

  const b = new Date(nowMs + 10 * 3600e3);    // UTC fields of b = Brisbane wall clock
  for (let back = 0; back < 8; back++) {
    const day = new Date(Date.UTC(b.getUTCFullYear(), b.getUTCMonth(), b.getUTCDate() - back));
    if (day.getUTCDay() !== wd) continue;
    const ms = Date.UTC(day.getUTCFullYear(), day.getUTCMonth(), day.getUTCDate(), h, +m[2]) - 10 * 3600e3;
    if (ms <= nowMs + 30 * 60e3) return ms;
  }
  return null;
}
function cellText(td) { return (td.textContent || "").replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim(); }
function parseBulletinHtml(html, bid) {        // same table layout update_data.py parses
  const doc = new DOMParser().parseFromString(html, "text/html"), out = {};
  for (const tr of doc.querySelectorAll("tr")) {
    const tds = tr.querySelectorAll("td");
    if (tds.length < 9) continue;
    const a = [...tr.querySelectorAll("a[href]")].map(x => /\.(\d{6})\.plt\.shtml/.exec(x.getAttribute("href"))).find(Boolean);
    if (!a) continue;
    const raw = cellText(tds[3]), h = parseFloat(raw);
    out[a[1]] = { time: cellText(tds[2]), height_raw: raw, height_m: /^-?\d+(\.\d+)?$/.test(raw) ? h : null,
                  datum: cellText(tds[4]), tendency: cellText(tds[5]).toLowerCase(), crossing: cellText(tds[6]),
                  flood_class: cellText(tds[7]), bulletin: bid };
  }
  return out;
}
async function fetchText(url) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), LIVE_TIMEOUT_MS);
  try {
    const r = await fetch(LIVE_PROXY ? LIVE_PROXY + encodeURIComponent(url) : url, { cache: "no-store", signal: ctl.signal, credentials: "omit" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.text();
  } finally { clearTimeout(t); }
}
async function refreshLive() {
  if (live.busy || !lastData) return;
  if (Date.now() - live.lastTry < LIVE_EVERY_MS - 5000) return;
  live.busy = true; live.lastTry = Date.now();
  const ids = [...new Set((lastData.bulletins || []).map(b => b.id))];
  const res = await Promise.allSettled(ids.map(async id => parseBulletinHtml(await fetchText(`https://www.bom.gov.au/fwo/${id}.html`), id)));
  let got = 0, errs = [];
  res.forEach((r, i) => {
    if (r.status === "fulfilled" && Object.keys(r.value).length) { Object.assign(live.readings, r.value); got++; }
    else errs.push(ids[i] + ": " + (r.status === "rejected" ? (r.reason && r.reason.name === "TypeError" ? "blocked by browser (CORS)" : (r.reason && r.reason.message) || "failed") : "no rows"));
  });
  live.checked = Date.now(); live.ok = got > 0; live.err = errs.join("; ");
  live.busy = false;
  if (lastData) { applyLive(lastData); drawMarkers(lastData); }
}
function liveStatus(s, lv) {   // mirrors flood_status() in update_data.py for an updated reading
  if (!s.flood_levels) return;
  const keys = ["minor", "moderate", "major"], known = keys.filter(k => s.flood_levels[k] != null).map(k => [k, s.flood_levels[k]]);
  Object.assign(s, { computed_class: null, next_class: null, next_level_m: null, delta_m: null, above_major_m: null });
  const h = s.height_m; if (h == null || !known.length) return;
  const cap = k => k[0].toUpperCase() + k.slice(1), r3 = v => Math.round(v * 1000) / 1000, r2 = v => Math.round(v * 100) / 100;
  let cur = "Below Flood Level";
  for (const [k, v] of known) if (r3(h - v) >= 0) cur = cap(k);
  s.computed_class = cur;
  const nxt = known.find(([, v]) => r3(h - v) < 0);
  if (nxt) { s.next_class = cap(nxt[0]); s.next_level_m = nxt[1]; s.delta_m = r2(nxt[1] - h); }
  else if (s.flood_levels.major != null) s.above_major_m = r2(h - s.flood_levels.major);
  const bk = classKey(s.flood_class);
  s.class_check = bk === "none" ? "no bulletin class" : (classKey(cur) === bk ? "agrees" : `differs (bulletin: ${s.flood_class})`);
}
function obsAge(s) {   // per-gauge "BOM reading N min/h ago"
  const t = bomTimeMs(s.time); if (t == null) return "";
  const m = Math.max(0, Math.round((Date.now() - t) / 60e3));
  const txt = m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`;
  return ` <span style="color:${m > 180 ? "#a15c00" : "#555"}">(BOM reading ${txt})</span>`;
}
function liveWhy() {   // one short reason; full per-bulletin detail in the tooltip
  const why = [...new Set((live.err || "failed").split("; ").map(x => x.replace(/^[^:]+: /, "")))];
  return why.length === 1 ? why[0] : why.join(", ");
}
function applyLive(data) {
  let merged = 0, newest = null;
  for (const s of data.stations || []) {
    const r = live.readings[s.station_no];
    const tOld = bomTimeMs(s.time), tNew = r && bomTimeMs(r.time);
    if (r && tNew != null && r.height_m != null && r.datum === s.datum && (tOld == null || tNew > tOld)) {
      Object.assign(s, { time: r.time, height_m: r.height_m, height_raw: r.height_raw, tendency: r.tendency,
                         crossing: r.crossing, flood_class: r.flood_class, live: true });
      liveStatus(s);
    }
    if (s.live) merged++;
    const t = bomTimeMs(s.time);
    if (t != null && (newest == null || t > newest)) newest = t;
  }
  const el = document.getElementById("live"); if (!el) return;
  const obs = newest ? `latest BOM observation ${fmtBneFull.format(new Date(newest))} AEST` : "no BOM observation time";
  const chk = live.checked ? fmtBne.format(new Date(live.checked)) + " AEST" : "";
  if (live.ok) {
    el.className = "ok";
    el.textContent = `Gauges: live from BOM in your browser (checked ${chk}; ${merged} newer than snapshot) \u00b7 ${obs}`;
  } else {
    el.className = live.checked ? "off" : ""; el.title = live.err || "";
    el.textContent = live.checked
      ? `Gauges: GitHub snapshot (GitHub Actions, scheduled every 15 min; BOM does not allow direct browser reads${liveWhy().includes("CORS") ? "" : ": " + liveWhy()}) \u00b7 ${obs}`
      : `Gauges: GitHub snapshot \u00b7 ${obs} \u00b7 checking BOM\u2026`;
  }
}

load().then(refreshLive);
setInterval(() => { load().then(refreshLive); refreshRadar(); }, LIVE_EVERY_MS);
// Re-fetch the snapshot when the tab comes back into view (phones pause timers in the background).
let lastVisLoad = Date.now();
document.addEventListener("visibilitychange", () => {
  if (document.hidden || Date.now() - lastVisLoad < 60e3) return;
  lastVisLoad = Date.now(); load().then(refreshLive); refreshRadar();
});
</script>
